name: Rollback

# Put traffic back on a version that was known good, and empty the edge cache.
#
# The version id comes from `npx wrangler versions list --name emptystates`, or
# from the run summary of the Production workflow that shipped it.
#
# GitHub only offers a `workflow_dispatch` once the workflow file exists on the
# repository's default branch. Until v2 merges to master, this cannot be
# triggered, and the break-glass path is the Cloudflare dashboard:
# Workers & Pages > emptystates > Deployments > Promote, then Caching > Purge
# Everything on the emptystat.es zone.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Worker version id to put back on 100% of traffic
        required: true
        type: string
      reason:
        description: What went wrong
        required: true
        type: string

permissions:
  contents: read

env:
  WORKER: emptystates

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://emptystat.es
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Move traffic to the named version
        run: |
          npx wrangler versions deploy "${VERSION_ID}@100" \
            --name "$WORKER" \
            --message "Rollback by ${GITHUB_ACTOR}: ${REASON}" \
            --yes
        env:
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge the zone cache
        run: bash scripts/purge-cache.sh
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
